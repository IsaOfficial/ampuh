<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AMPUH application showcase</title>
  <desc id="desc">Portfolio preview for the AMPUH employee daily report monitoring system.</desc>
  <defs>
