      <stop stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#E8F5EF"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F8A45"/>
      <stop offset="1" stop-color="#22C98B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B2D20" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="34" fill="url(#bg)"/>

  <g filter="url(#shadow)">
